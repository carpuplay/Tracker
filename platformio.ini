[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps = 
    vshymanskyy/TinyGSM @ ^0.11.7
    adafruit/Adafruit LIS3DH @ ^1.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9

build_flags = 
    -DTINY_GSM_MODEM_SIM7600
    -DTINY_GSM_RX_BUFFER=1024
